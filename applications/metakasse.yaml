apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metakasse
spec:
  destination:
    namespace: metakasse
    server: "https://kubernetes.default.svc"
  source:
    path: manifests/metakasse
    repoURL: "https://github.com/openlab-aux/k8s"
    targetRevision: main
    directory:
      recurse: true
  sources: []
  project: default
  syncPolicy:
    syncOptions: []

