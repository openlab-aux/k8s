apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
spec:
  project: "default"
  destination:
    namespace: minio
    server: "https://kubernetes.default.svc"
  sources:
    - repoURL: "https://operator.min.io"
      targetRevision: 7.1.1
      chart: operator
      helm:
        values: |
          operator:
            replicaCount: 1
    - repoURL: "https://operator.min.io"
      targetRevision: 7.1.1
      chart: tenant
      helm:
        values: |
          ingress:
            api:
              enabled: true
              ingressClassName: haproxy
              host: minio.lab.weltraumpflege.org
              annotations:
                cert-manager.io/cluster-issuer: le-prod
                haproxy.org/server-ssl: "true"
                haproxy.org/path-rewrite: /
              tls:
                - hosts:
                    - minio.lab.weltraumpflege.org
                  secretName: minio-api-cert
            console:
              enabled: true
              ingressClassname: haproxy
              host: console.minio.lab.weltraumpflege.org
              annotations:
                cert-manager.io/cluster-issuer: le-prod
                haproxy.org/server-ssl: "true"
                haproxy.org/path-rewrite: /

              tls:
                - hosts:
                    - console.minio.lab.weltraumpflege.org
                  secretName: minio-console-cert


          tenant:
            name: openlab

            features:
              enableSFTP: true

            configuration:
              name: openlab-tenant-secret

            configSecret:
              name: openlab-tenant-secret

            pools:
              - servers: 1
                name: pool-0
                volumesPerServer: 1
                size: 50Gi
                storageClassName: openebs-hostpath
