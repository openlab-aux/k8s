apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: directus
  labels:
    app: directus
  annotations:
    cert-manager.io/cluster-issuer: "le-prod"
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - cms.openlab-augsburg.de
      secretName: directus-tls
  rules:
    - host: cms.openlab-augsburg.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: directus
                port:
                  name: http
