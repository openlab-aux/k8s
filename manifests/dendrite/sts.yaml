apiVersion: v1
kind: Service
metadata:
  name: dendrite
  labels:
    app: dendrite
spec:
  ports:
    - port: 8008
      name: foo
    - port: 8448
      name: bar
  clusterIP: None
  selector:
    app: dendrite
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dendrite
spec:
  serviceName: "dendrite"
  replicas: 1
  selector:
    matchLabels:
      app: dendrite
  template:
    metadata:
      labels:
        app: dendrite
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      volumes:
        - name: config
          secret:
            secretName: keys
            optional: false
      containers:
        - name: dendrite
          # We are sneaky fucking liars, calling it dendrite when it's actually zendrite
          # Hehe.
          image: codefloe.com/pat-s/zendrite:3.7.0
          ports:
            - containerPort: 8008
            - containerPort: 8448
          volumeMounts:
            - name: config
              mountPath: /etc/zendrite
            - name: media
              mountPath: /var/zendrite/media
            - name: jetstream
              mountPath: /var/zendrite/jetstream
            - name: searchindex
              mountPath: /var/zendrite/searchindex
  volumeClaimTemplates:
    - metadata:
        name: media
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: jetstream
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: searchindex
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
