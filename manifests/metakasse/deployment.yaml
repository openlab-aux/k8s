apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: metakasse
  name: metakasse
  namespace: metakasse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metakasse
  template:
    metadata:
      labels:
        app: metakasse
    spec:
      containers:
      - env:
        - name: ORIGIN
          value: https://metakasse.lab.weltraumpflege.org
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: uri
              name: db-app
        image: codeberg.org/waaaaargh/metakasse:latest
        imagePullPolicy: Always
        name: metakasse
        ports:
        - containerPort: 3000
          protocol: TCP
        resources: {}