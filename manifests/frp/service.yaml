apiVersion: v1
kind: Service
metadata:
  name: frps
  namespace: frp
spec:
  selector: { app: frps }
  ports:
    - { name: http, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: frps-control
  namespace: frp
spec:
  type: NodePort
  selector: { app: frps }
  ports:
    - { name: control, port: 7000, nodePort: 30700 }
