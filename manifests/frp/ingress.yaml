apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fmd
  namespace: frp
  annotations:
    cert-manager.io/cluster-issuer: le-prod
    haproxy.org/response-set-header: 'Referrer-Policy "strict-origin-when-cross-origin"'
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - fmd.openlab-augsburg.de
      secretName: fmd-tls
  rules:
    - host: fmd.openlab-augsburg.de
      http:
        paths:
          - path: /~!frp
            pathType: Prefix
            backend:
              service:
                name: frps-control
                port:
                  number: 7000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frps
                port:
                  number: 8080
