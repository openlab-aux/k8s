apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fmd
  namespace: frp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 15m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [fmd.openlab-augsburg.de]
      secretName: fmd-tls
  rules:
    - host: fmd.openlab-augsburg.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frps, port: { number: 8080 } }
